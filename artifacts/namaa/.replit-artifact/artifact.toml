kind = "web"
previewPath = "/"
title = "نماء — المستشار المالي الذكي"
version = "1.0.0"
id = "artifacts/namaa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23584

[services.development]
run = "pnpm --filter @workspace/namaa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/namaa", "run", "build" ]
serve = "static"
publicDir = "artifacts/namaa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23584"
BASE_PATH = "/"
